name: CI (build + coop tests + publish)

# FREE GitHub-hosted runners. Builds x64 Release from a clean checkout, runs the
# coop harness headless, and publishes a rolling nightly (push to main) or a
# versioned release (push of a v* tag), then attaches WinXP i686 and Linux x86_64
# builds to the same release. Licensed UFO game data is pulled from the private
# OpenXcom-Coop/UFO_Data repo via a read-only deploy key (UFO_DATA_DEPLOY_KEY)
# and only ever exists in the test job, so it can never leak into a release.
#
# Job graph:
#
#   meta ─┬─ build ── coop-tests ─┐
#         ├─ build-winxp ─────────┼─ publish   (all three packages, one release)
#         └─ build-linux ─────────┘
#
# Split into separate jobs so a flaky test can be re-run ("Re-run failed jobs")
# without repeating the ~13m build, and so per-stage durations show in the run
# summary graph. `meta` exists so the two cross-builds - which share no artifact
# with the x64 build - can start immediately instead of waiting on it for the
# version string; they upload their packages and `publish` attaches all three at
# once, so a release is never briefly live missing a platform.
on:
  push:
    branches: [main]        # -> rolling "nightly" prerelease
    tags: ['v*']            # -> versioned release, marked latest
  workflow_dispatch:

concurrency: { group: ci-main, cancel-in-progress: false }   # publishes are ordered; never overlap
permissions: { contents: read }                              # write only in the publishing jobs

jobs:
  # Version/channel for the whole run, computed once so every build job can start
  # immediately. It used to live inside `build`, and since job outputs only exist
  # once the job finishes, the WinXP and Linux builds could not start until the
  # ~13-minute x64 build had finished - even though they share no artifact with it.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version:    ${{ steps.meta.outputs.version }}
      gitSuffix:  ${{ steps.meta.outputs.gitSuffix }}
      channel:    ${{ steps.meta.outputs.channel }}
      tag:        ${{ steps.meta.outputs.tag }}
      name:       ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest:     ${{ steps.meta.outputs.latest }}
      lastTag:    ${{ steps.meta.outputs.lastTag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }    # full history: version = git describe

      - name: Compute version + channel
        id: meta
        shell: pwsh
        run: |
          $vh = "src/version.h"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # ---- official release: version = the tag ----
            $v = $env:GITHUB_REF_NAME.TrimStart('v')            # 8.4.3
            $gitSuffix = " (v$v)"
            "channel=release"          >> $env:GITHUB_OUTPUT
            "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
            "name=$env:GITHUB_REF_NAME">> $env:GITHUB_OUTPUT
            "prerelease=false"         >> $env:GITHUB_OUTPUT
            "latest=true"              >> $env:GITHUB_OUTPUT
          } else {
            # ---- rolling nightly: patch = last-tag patch + commits since tag ----
            $desc = (git describe --tags --long --match "v*" 2>$null)
            if ($desc -match '^v(\d+)\.(\d+)\.(\d+)-(\d+)-g') {
              $v = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + [int]$Matches[4])"
            } else {
              # no release tag yet: base from version.h + total commit count
              $m = [regex]::Match((Get-Content $vh -Raw), 'OPENXCOM_VERSION_LONG "(\d+)\.(\d+)\.(\d+)')
              $n = [int](git rev-list --count HEAD)
              $v = "$($m.Groups[1].Value).$($m.Groups[2].Value).$([int]$m.Groups[3].Value + $n)"
            }
            $sha  = (git rev-parse --short HEAD)
            $date = (git show -s --format=%cd --date=format:'%Y-%m-%d')
            $gitSuffix = " (nightly $date $sha)"
            "channel=nightly"                 >> $env:GITHUB_OUTPUT
            "tag=nightly"                     >> $env:GITHUB_OUTPUT
            "name=Nightly $v ($sha)"          >> $env:GITHUB_OUTPUT
            "prerelease=true"                 >> $env:GITHUB_OUTPUT
            "latest=false"                    >> $env:GITHUB_OUTPUT
          }
          # Last official release tag reachable from HEAD (e.g. v2.0.0). Used to pin the
          # base for nightly release-notes so they cover only "since the last release"
          # instead of the whole history. Match v<digit> to skip legacy junk tags
          # (OpenXcomCoop_*, v-non-numeric). Empty on a repo with no release tag yet.
          $lastTag = (git describe --tags --abbrev=0 --match "v[0-9]*" 2>$null)
          "lastTag=$lastTag"       >> $env:GITHUB_OUTPUT
          "version=$v"             >> $env:GITHUB_OUTPUT
          "gitSuffix=$gitSuffix"   >> $env:GITHUB_OUTPUT
          Write-Host "version: $v$gitSuffix (base: $lastTag)"

  build:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Stamp src/version.h
        shell: bash
        run: sh tools/ci/stamp_version.sh "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.gitSuffix }}"

      - name: Build x64 Release (serial)
        timeout-minutes: 60
        # Serial: /m can OOM the template-heavy TUs (C1060). Unique _MSPDBSRV_ENDPOINT_
        # avoids the per-user mspdbsrv PDB-server collision (C1090 / D8040) if a runner
        # is ever shared with another build.
        env:
          _MSPDBSRV_ENDPOINT_: ci_${{ github.run_id }}_${{ github.run_attempt }}
        shell: cmd
        working-directory: src
        run: msbuild OpenXcom.2010.sln /v:minimal /p:Configuration=Release /p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: game-exe
          path: bin/x64/Release/OpenXcom.exe
          if-no-files-found: error
          retention-days: 7

      # Debug symbols for crash symbolication. MSVC emits OpenXcom.pdb next to the
      # exe from the same link (matched to it by GUID+age), so no build change is
      # needed - the PDB just has to be captured. `publish` folds it into Symbols.zip.
      - uses: actions/upload-artifact@v4
        with:
          name: sym-x64
          path: bin/x64/Release/OpenXcom.pdb
          if-no-files-found: error
          retention-days: 7

  # Splits the suite into 4 runtime-balanced shards, ONCE, from the previous run's
  # measured durations (Actions cache; tools/ci/test_weights.json on a cold cache).
  # Every shard consumes this one plan, so a cache refresh mid-run cannot make two
  # shards disagree about who runs what.
  shard-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .ci_timings
          key: coop-timings-${{ github.run_id }}       # never hits; restore-keys does the work
          restore-keys: coop-timings-                  # newest cache from this branch, else main

      - shell: pwsh
        run: ./tools/ci/plan_shards.ps1 -Of 4 -Timings .ci_timings/timings.json -Out shard-plan.json

      - uses: actions/upload-artifact@v4
        with: { name: shard-plan, path: shard-plan.json, if-no-files-found: error, retention-days: 7 }

  coop-shard:
    needs: [build, shard-plan]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false          # one shard's failure must not hide the others' results
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v4    # shallow: only needs bin data + tools/, not history

      - uses: actions/download-artifact@v4
        with:
          name: game-exe
          path: bin/x64/Release

      - uses: actions/download-artifact@v4
        with: { name: shard-plan }

      - name: Fetch UFO data (private, licensed)
        uses: actions/checkout@v4
        with:
          repository: OpenXcom-Coop/UFO_Data
          ssh-key: ${{ secrets.UFO_DATA_DEPLOY_KEY }}
          path: .ufo_data
          persist-credentials: false

      - name: Stage data next to exe
        shell: pwsh
        run: ./tools/ci/stage_data.ps1

      - name: Coop test suite (headless, shard ${{ matrix.shard }}/4)
        timeout-minutes: 25
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: >-
          ./tools/ci/run_coop_suite.ps1 -PlanFile shard-plan.json
          -Shard ${{ matrix.shard }} -TimingsOut timings-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()               # a failed shard still measured everything before it
        with:
          name: timings-${{ matrix.shard }}
          path: timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  # Release gate + aggregation. Keeps the name `coop-tests` because main's branch
  # protection requires that check by name - a matrix job would publish as
  # "coop-shard (1)" and the required check would never report.
  coop-tests:
    needs: coop-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A matrix job's aggregate result is 'success' only when every leg passed.
      # 'skipped' means an upstream job failed - that already blocks publish, and
      # failing here too would just add noise.
      - name: Gate on every shard
        if: needs.coop-shard.result == 'failure' || needs.coop-shard.result == 'cancelled'
        run: |
          echo "::error::coop-shard: ${{ needs.coop-shard.result }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { pattern: timings-*, path: .ci_new, merge-multiple: false }
        continue-on-error: true

      - uses: actions/cache/restore@v4
        with:
          path: .ci_timings
          key: coop-timings-${{ github.run_id }}
          restore-keys: coop-timings-
        continue-on-error: true

      - name: Merge shard timings for the next run's plan
        shell: pwsh
        continue-on-error: true    # balance is an optimization; never fail the gate on it
        run: |
          New-Item -ItemType Directory -Force .ci_timings | Out-Null
          ./tools/ci/merge_timings.ps1 -In .ci_new -Prev .ci_timings/timings.json -Out .ci_timings/timings.json

      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .ci_timings
          key: coop-timings-${{ github.run_id }}

  # The ONLY job that writes to the release, and it does it once with all three
  # packages attached. It used to create the release with just the x64 zip and let
  # build-winxp/build-linux append theirs afterwards, which left the nightly briefly
  # live with a missing platform and serialized two builds that share nothing with
  # the x64 one behind the whole build -> coop-tests chain.
  publish:
    needs: [meta, build, coop-tests, build-winxp, build-linux]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions: { contents: write }   # publish releases + move nightly tag
    steps:
      - uses: actions/checkout@v4      # shallow: bin data, LICENSE, CHANGELOG, tag push

      - uses: actions/download-artifact@v4
        with:
          name: game-exe
          path: bin/x64/Release

      - name: Download the WinXP + Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: .pkgs
          merge-multiple: true

      - name: Download debug symbols (x64 PDB + WinXP/Linux .debug)
        uses: actions/download-artifact@v4
        with:
          pattern: sym-*
          path: .syms
          merge-multiple: true    # distinct filenames -> flatten all three into .syms

      - name: Stage packaging inputs (no UFO data in this job)
        shell: pwsh
        run: |
          robocopy deps\lib\x64 bin\x64\Release *.dll /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }
          if (-not (Test-Path "bin\x64\Release\OpenXcom.exe")) { throw "exe artifact missing" }

      - name: Bundle MSVC x64 CRT (app-local, so no VC++ Redistributable needed)
        shell: pwsh
        run: |
          # The shipped x64 exe links the MSVC runtime dynamically (OpenXcom.2010.vcxproj
          # Release|x64 = MultiThreadedDLL, i.e. /MD), so it needs vcruntime140.dll,
          # vcruntime140_1.dll and msvcp140.dll at runtime. Only the third-party libs
          # (SDL, zlib, ...) were bundled, so on a fresh machine WITHOUT the VC++
          # Redistributable installed the game failed to start with "DLL are missing".
          # Ship the CRT app-local next to the exe (Microsoft-sanctioned redistribution).
          # The Universal CRT (ucrtbase.dll) ships with Windows 10+, so it is not bundled.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere - cannot locate MSVC redist" }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "no Visual Studio install found for the MSVC redist" }
          # The redist version dir floats with the toolset; take the newest x64 CRT dir.
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "MSVC x64 CRT redist dir not found under $vsRoot\VC\Redist\MSVC" }
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            $src = Join-Path $crtDir.FullName $d
            if (-not (Test-Path $src)) { throw "CRT DLL missing from redist: $src" }
            Copy-Item $src bin\x64\Release -Force
          }
          Write-Host "bundled MSVC x64 CRT from $($crtDir.FullName)"

      - name: Write release rendezvous.json (real Official server, from secret)
        shell: pwsh
        env:
          RELEASE_RENDEZVOUS_JSON: ${{ secrets.RELEASE_RENDEZVOUS_JSON }}
        run: |
          # The test job ran against the blackhole tools/coop_test/rendezvous.ci.json.
          # For the shipped zip, write the real config from the repo secret so end
          # users get a working "Official" server. Fail loudly if the secret is unset
          # so a broken/placeholder config never ships.
          $d = "bin\x64\Release"
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_RENDEZVOUS_JSON)) {
            throw "RELEASE_RENDEZVOUS_JSON secret is empty/unset - set it (repo Settings > Secrets and variables > Actions) before publishing a release."
          }
          try { $null = $env:RELEASE_RENDEZVOUS_JSON | ConvertFrom-Json } catch { throw "RELEASE_RENDEZVOUS_JSON is not valid JSON: $_" }
          Set-Content "$d\rendezvous.json" $env:RELEASE_RENDEZVOUS_JSON -Encoding ascii -NoNewline
          Write-Host "release rendezvous.json written ($((Get-Item "$d\rendezvous.json").Length) bytes)"

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.version }}"
          $z = "openxcom-coop-$v-x64.zip"
          "ZIP=$z" >> $env:GITHUB_ENV
          # Stage the exact tree we ship. UFO/TFTD are staged one subdirectory at a
          # time (never the whole dir): the game needs UFO\multiplayer\base.png at
          # runtime - Globe's ctor throws and kills "new game" without it - while the
          # rest of UFO/ is licensed retail data that must never be packaged.
          $p = "pkg"
          Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $p, "$p\UFO", "$p\TFTD" | Out-Null
          Copy-Item bin\x64\Release\OpenXcom.exe,bin\x64\Release\*.dll,bin\x64\Release\rendezvous.json,LICENSE.txt $p
          Copy-Item bin\common,bin\standard $p -Recurse
          Copy-Item bin\UFO\multiplayer  "$p\UFO"  -Recurse    # coop art only
          Copy-Item bin\TFTD\multiplayer "$p\TFTD" -Recurse    # coop art only
          Compress-Archive "$p\*" -DestinationPath $z -Force
          ./tools/ci/assert_package.ps1 $z
          # Regression guard for the "requires C++ Redistributable" bug: the /MD-linked
          # x64 exe needs these three CRT DLLs bundled app-local. WinXP is static and
          # Linux/macOS bundle their own runtime, so this check is x64-only.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zx = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $z).Path)
          try { $zn = @($zx.Entries.FullName -replace '\\','/') } finally { $zx.Dispose() }
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            if ($zn -notcontains $d) { throw "$z is missing bundled CRT $d - would need the VC++ Redistributable" }
          }
          # The WinXP zip was asserted as a staged tree in its own job; re-assert the
          # finished archive here, so what actually gets uploaded is what was checked.
          $xp = Get-ChildItem .pkgs\*winxp*.zip | Select-Object -First 1
          if (-not $xp) { throw "WinXP package artifact missing" }
          ./tools/ci/assert_package.ps1 $xp.FullName
          $lin = Get-ChildItem .pkgs\*linux*.zip | Select-Object -First 1
          if (-not $lin) { throw "Linux package artifact missing" }
          # All three debug-symbol files (x64 OpenXcom.pdb, WinXP + Linux .debug) in
          # ONE Symbols.zip release asset - never inside the player packages, so a
          # crash dump from any platform can be symbolicated from the matching release.
          # Fail loudly if any is missing rather than shipping partial symbols.
          $syms = Get-ChildItem .syms -File
          foreach ($n in 'OpenXcom.pdb','openxcom-winxp-i686.debug','openxcom-linux-x86_64.debug') {
            if ($syms.Name -notcontains $n) { throw "symbol file missing from Symbols.zip: $n" }
          }
          $sym = "Symbols.zip"
          Compress-Archive .syms\* -DestinationPath $sym -Force
          # Multi-line env var: GITHUB_ENV needs the delimiter form, and
          # action-gh-release takes newline-separated paths in `files:`.
          $assets = @($z, $xp.FullName, $lin.FullName, $sym) -join "`n"
          "ASSETS<<PKGEOF`n$assets`nPKGEOF" >> $env:GITHUB_ENV
          Write-Host "publishing:`n$assets"

      - name: Release notes from CHANGELOG (release only)
        if: needs.meta.outputs.channel == 'release'
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.version }}"
          $out = "release-notes.md"
          if (-not (Test-Path "CHANGELOG.md")) { throw "CHANGELOG.md missing - add a '## [$v]' section before tagging" }
          # extract the "## [<v>]" section up to the next "## " heading
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern ("^##\s*\[?" + [regex]::Escape($v) + "\]?") | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v (expected '## [$v]')" }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $body += $lines[$i]
          }
          Set-Content $out ($body -join "`n").Trim() -Encoding utf8
          # ${v} not $v - pwsh parses "$v:" as a drive-qualified variable (ParserError)
          Write-Host "Release notes for ${v}:"; Get-Content $out

      - name: Move rolling nightly tag
        if: needs.meta.outputs.channel == 'nightly'
        shell: pwsh
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Reset rolling nightly release (avoid notes + asset buildup)
        if: needs.meta.outputs.channel == 'nightly'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The nightly tag/release rolls. Re-publishing to it appends release notes
          # and accumulates versioned assets (old x64/WinXP/Linux files never get
          # overwritten). Delete the previous nightly RELEASE (keep the just-moved
          # tag) so Publish recreates it fresh: correct notes + only this run's assets.
          gh release delete nightly --repo "$env:GITHUB_REPOSITORY" --yes 2>$null
          $global:LASTEXITCODE = 0
          Write-Host "Cleared previous nightly release (if any)"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    ${{ needs.meta.outputs.tag }}
          name:        ${{ needs.meta.outputs.name }}
          prerelease:  ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.latest }}
          files: ${{ env.ASSETS }}      # x64 zip + WinXP zip + Linux zip, one call
          # release -> curated notes from CHANGELOG.md; nightly -> generated by the next
          # step, pinned to previous_tag_name (GitHub's auto base picks the whole history
          # for the non-semver `nightly` tag -> notes grow forever). Publish with an empty
          # body; the strip step below fills it in.
          body_path: ${{ needs.meta.outputs.channel == 'release' && 'release-notes.md' || '' }}
          generate_release_notes: false

      - name: Generate nightly notes since last release + strip authorship
        if: needs.meta.outputs.channel == 'nightly'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate the "What's Changed" list ourselves, pinned to the last official
          # release. GitHub's auto base-selection can't order the non-semver `nightly`
          # tag against the legacy junk tags, so it diffs from ~repo start and the notes
          # grow without bound. previous_tag_name = last release => notes cover exactly
          # the commits since that release. Empty lastTag (no release yet) falls back to
          # GitHub's default base.
          $prev = "${{ needs.meta.outputs.lastTag }}"
          $call = @('api', "repos/$env:GITHUB_REPOSITORY/releases/generate-notes",
                    '-f', 'tag_name=nightly',
                    '-f', 'target_commitish=${{ github.sha }}')
          if ($prev) { $call += @('-f', "previous_tag_name=$prev") }
          Write-Host "generate-notes base: $(if ($prev) { $prev } else { '(auto)' })"
          # gh returns the body as a string[] (one element per line). Without an explicit
          # -join, PowerShell coerces it to a single string joined with SPACES, which
          # destroys every newline (notes render as one run-on paragraph) and makes the
          # regexes below never match. Always -join "`n" first.
          $body  = (& gh @call --jq '.body') -join "`n"
          # "New Contributors" is meaningless on a rolling tag: GitHub recomputes it each
          # run against a shifting base and flags even the original dev as "new". Remove
          # that section, keeping "## What's Changed" + "Full Changelog".
          $clean = [regex]::Replace($body, "(?s)\r?\n?## New Contributors\r?\n(?:\*.*\r?\n?)*\r?\n?(?=\*\*Full Changelog\*\*)", "`n`n")
          # Drop the "by @author" credit from each "What's Changed" bullet - the notes
          # should describe the change, not the committer.
          $clean = [regex]::Replace($clean, ' by @[A-Za-z0-9-]+ in (https://\S+)', ' in $1')
          Set-Content nightly-notes.md $clean -Encoding utf8
          if ($clean -notmatch "## What's Changed") { throw "nightly notes look wrong after strip - aborting rather than publishing mangled notes" }
          gh release edit nightly --repo "$env:GITHUB_REPOSITORY" --notes-file nightly-notes.md
          Write-Host "Stripped 'New Contributors' + author handles from nightly notes"

  # 32-bit static WinXP binary, MinGW cross-compiled on Linux via MXE. Shares no
  # artifact with the x64 build, so it starts as soon as `meta` has the version and
  # runs alongside build + coop-tests; `publish` attaches the zip it uploads here.
  # (Folded in from the old build-mxe.yml/build-winxp.yml - one unified CI.)
  build-winxp:
    needs: meta
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools + MXE deps
        # Retried: hosted runners share an egress to archive.ubuntu.com and
        # intermittently get "Connection failed" part-way through the fetch. That is
        # all that killed the nightly at 8.4.13215 (run 29942028942 - g++, libsasl2-2
        # and unzip each failed to download after 100+ MB had come through fine).
        # Acquire::Retries covers a single blip; the outer loop re-runs `update` too,
        # so a mirror that has since rotated its index cannot leave us pinned to a
        # version that no longer exists. This step must run BEFORE checkout (the
        # container has no git, which `submodules: recursive` needs), so the retry
        # cannot be factored out into a repo script.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt_get() { apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 "$@"; }
          ok=0
          for n in 1 2 3 4; do
            if apt_get update && apt_get install -y \
                 git make g++ build-essential \
                 autopoint gperf intltool libtool-bin lzip zip \
                 ca-certificates wget xz-utils bzip2 \
                 file patch perl pkg-config curl \
                 python2-minimal \
                 p7zip-full bison flex ruby \
                 gdk-pixbuf2.0-bin \
                 libssl-dev libcurl4-openssl-dev zlib1g-dev libexpat1-dev libncurses5-dev
            then ok=1; break; fi
            echo "apt attempt $n failed (mirror flake); retrying in $((n * 15))s"
            sleep $((n * 15))
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get failed after 4 attempts"; exit 1; }
          ln -sf /usr/bin/python2.7 /usr/bin/python  || true
          ln -sf /usr/bin/python2.7 /usr/bin/python2 || true

      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: recursive }

      - name: Cache MXE toolchain
        id: cache-mxe
        uses: actions/cache@v4
        with:
          path: mxe
          key: Linux-mxe-v7e39b555dee5e906b24a44940055dc28d4056d23-gcc11-jsoncpp-sdl_net-libsodium-v8

      - name: Build MXE toolchain (only on cache miss)
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        run: |
          if [ ! -d mxe ]; then git clone https://github.com/mxe/mxe.git mxe; fi
          cd mxe
          git checkout 7e39b555dee5e906b24a44940055dc28d4056d23
          # keep mingw-w64 VERSION + CHECKSUM in sync
          sed -i 's/$(PKG)_VERSION := 8\.0\.2/$(PKG)_VERSION := 8.0.3/' src/mingw-w64.mk
          sed -i 's/$(PKG)_CHECKSUM := f00cf1e2f975008855c93b9e0f8ec97decbf50f478e7ae4c7b5ffb9cdc54b743/$(PKG)_CHECKSUM := d702ef712c8f22035f81ddf6089542adf6bcb6ea669d4ebf4e311f87242882f0/' src/mingw-w64.mk
          export MXE_PLUGIN_DIRS="$PWD/plugins/gcc11"
          make MXE_TARGETS=i686-w64-mingw32.static JOBS=$(nproc) \
            gcc cmake \
            sdl sdl_net sdl_gfx sdl_mixer sdl_image \
            yaml-cpp jsoncpp libsodium

      - name: Stamp src/version.h
        run: sh tools/ci/stamp_version.sh "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.gitSuffix }}"

      - name: Configure + build (WinXP i686 static)
        run: |
          set -euxo pipefail
          export PATH="$GITHUB_WORKSPACE/mxe/usr/bin:$PATH"
          export MXE_PREFIX="$GITHUB_WORKSPACE/mxe/usr/i686-w64-mingw32.static"
          export PKG_CONFIG_PATH="$MXE_PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$MXE_PREFIX/lib/pkgconfig"
          rm -rf build && mkdir -p build && cd build
          # -g: GCC/MinGW Release is -O3 -DNDEBUG with NO debug info (unlike MSVC,
          # which emits a PDB regardless). CMAKE_CXX_FLAGS is the *base*, so -g lands
          # before CMAKE_CXX_FLAGS_RELEASE's -O3 - optimized code WITH DWARF symbols.
          i686-w64-mingw32.static-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEV_BUILD=OFF \
            -DBUILD_PACKAGE=OFF \
            -DCMAKE_CXX_FLAGS="-g" \
            -DCMAKE_PREFIX_PATH="$MXE_PREFIX" \
            -DDEPS_DIR= \
            "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
          # Split the DWARF debug info into a separate .debug (for Symbols.zip), then
          # strip the shipped exe and add a debuglink so a debugger can pair them
          # (matched by the debuglink's CRC). Keeps the WinXP zip small while keeping
          # symbols archivable. objcopy/strip are the MXE cross-tools on PATH above.
          i686-w64-mingw32.static-objcopy --only-keep-debug bin/openxcom.exe "$GITHUB_WORKSPACE/openxcom-winxp-i686.debug"
          i686-w64-mingw32.static-strip --strip-debug --strip-unneeded bin/openxcom.exe
          i686-w64-mingw32.static-objcopy --add-gnu-debuglink="$GITHUB_WORKSPACE/openxcom-winxp-i686.debug" bin/openxcom.exe

      - name: Package WinXP zip
        env:
          RELEASE_RENDEZVOUS_JSON: ${{ secrets.RELEASE_RENDEZVOUS_JSON }}
        run: |
          set -euxo pipefail
          # CMake's post-build step copies bin/{UFO,TFTD,common,standard} into
          # build/bin, and this job used to just zip that - which is why it got the
          # data dirs right and the non-build-output files wrong: it shipped no
          # rendezvous.json (Official server list comes up empty, see
          # rendezvous_config.cpp) and no LICENSE.txt. Inject both, exactly like the
          # x64 and Linux packages do, then assert the tree before zipping it.
          if [ -z "$RELEASE_RENDEZVOUS_JSON" ]; then echo "RELEASE_RENDEZVOUS_JSON secret empty"; exit 1; fi
          printf '%s' "$RELEASE_RENDEZVOUS_JSON" > build/bin/rendezvous.json
          grep -q '"servers"' build/bin/rendezvous.json || { echo "rendezvous.json has no servers array"; exit 1; }
          cp LICENSE.txt build/bin/
          sh tools/ci/assert_package_dir.sh build/bin
          cd build/bin
          rm -f libopenxcom.dll.a || true
          zip -r "$GITHUB_WORKSPACE/openxcom-coop-winxp-${{ needs.meta.outputs.version }}-i686.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-winxp
          path: openxcom-coop-winxp-${{ needs.meta.outputs.version }}-i686.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: sym-winxp
          path: openxcom-winxp-i686.debug
          if-no-files-found: error
          retention-days: 7

  # Native Linux (x86_64) build via GCC. Like the WinXP job it only needs `meta`,
  # so it runs in parallel with the x64 build; `publish` attaches its zip.
  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    # Build inside a low-glibc container so the AppImage runs on nearly every
    # current distro: an AppImage bundles its own libs but NOT glibc, so its
    # portability floor is the build host's glibc, and ubuntu-latest (2.39) would
    # lock out older distros and reproduce the very "can't run it" bug this fixes.
    # debian:11 (bullseye) gives glibc 2.31 - covers Debian 11+, Ubuntu 20.04+ and
    # RHEL/Rocky 9 (2.34) - with gcc 10. Its distro jsoncpp (1.9.4) makes the coop
    # code's int64/uint64 -> Json::Value writes ambiguous on gcc, so we build
    # jsoncpp 1.9.5 from source below (the version ubuntu-latest had when this
    # compiled) rather than change the game source or raise the glibc floor.
    container: debian:11
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Install deps
        # Same mirror-flake retry as build-winxp - see the comment there. No sudo
        # (root in the container); git must land BEFORE checkout, which the
        # `submodules: recursive` step needs and the bare container lacks.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt_get() { apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 "$@"; }
          ok=0
          for n in 1 2 3 4; do
            if apt_get update && apt_get install -y \
                 git ca-certificates wget file pkg-config python3 zip \
                 cmake g++ make patchelf \
                 libsdl1.2-dev libsdl-mixer1.2-dev libsdl-gfx1.2-dev libsdl-image1.2-dev libsdl-net1.2-dev \
                 libyaml-cpp-dev libsodium-dev zlib1g-dev
            then ok=1; break; fi
            echo "apt attempt $n failed (mirror flake); retrying in $((n * 15))s"
            sleep $((n * 15))
          done
          [ "$ok" = 1 ] || { echo "::error::apt-get failed after 4 attempts"; exit 1; }

      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: recursive }

      - name: Build jsoncpp 1.9.5 from source
        # The distro jsoncpp (bullseye 1.9.4) types Int64/UInt64 as long long, so on
        # LP64 a raw int64_t/uint64_t (long) -> Json::Value write is ambiguous and
        # the coop code fails to compile. 1.9.5 types them as int64_t/uint64_t, so
        # those writes match exactly - this is the jsoncpp the code has always been
        # built against on ubuntu-latest. Install to /usr/local; ldconfig so the
        # linker/loader (and linuxdeploy's ldd) resolve it. NOT the distro package.
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.9.5 https://github.com/open-source-parsers/jsoncpp.git /tmp/jsoncpp
          cmake -S /tmp/jsoncpp -B /tmp/jsoncpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DJSONCPP_WITH_TESTS=OFF -DJSONCPP_WITH_POST_BUILD_UNITTEST=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/jsoncpp/build -j"$(nproc)"
          cmake --install /tmp/jsoncpp/build
          ldconfig

      - name: Stamp src/version.h
        run: sh tools/ci/stamp_version.sh "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.gitSuffix }}"

      - name: Configure + build (Linux x86_64)
        run: |
          set -euxo pipefail
          # Prefer the from-source jsoncpp in /usr/local over anything else: its .pc
          # for the -I flags, its lib dir for the -ljsoncpp link.
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LIBRARY_PATH="/usr/local/lib:${LIBRARY_PATH:-}"
          JSONCPP_CFLAGS=$(pkg-config --cflags jsoncpp)
          rm -rf build && mkdir -p build && cd build
          # -pthread: the coop code spawns std::threads, but the CMake build never
          # links libpthread. On glibc >= 2.34 (ubuntu-latest) pthread lives in libc
          # so it links anyway; on glibc 2.31 (debian:11) libpthread is separate and
          # the link fails with "undefined reference to pthread_create", so force it.
          # -g adds DWARF symbols (Release is -O3 -DNDEBUG with none). It sits in the
          # base CXX flags, ahead of -O3, so the binary stays optimized but debuggable.
          cmake -DCMAKE_BUILD_TYPE=Release -DDEV_BUILD=OFF -DBUILD_PACKAGE=OFF \
            -DCMAKE_CXX_FLAGS="$JSONCPP_CFLAGS -pthread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
          # Split debug info OUT before the AppImage step (linuxdeploy strips the
          # bundled binary). gdb re-pairs this .debug to the stripped binary via the
          # GNU build-id ld emits by default, so extracting is enough - no strip here.
          objcopy --only-keep-debug bin/openxcom "$GITHUB_WORKSPACE/openxcom-linux-x86_64.debug"

      - name: Build AppImage (linuxdeploy)
        run: |
          set -euxo pipefail
          # Bundle the binary + its shared libs into a self-contained AppImage,
          # restoring the pre-2.0.0 Linux UX. A bare dynamically-linked binary
          # needs matching system SDL and a new-enough glibc; the AppImage carries
          # its own libs, so it runs on any x86_64 desktop. Data folders still live
          # NEXT TO the AppImage in the zip - the game finds common/, standard/
          # and rendezvous.json via the "./" (CWD) entry in findDataFolders(), so it
          # must be run from the extracted folder, same as the v1.8.4 release.
          #
          # linuxdeploy and its appimage plugin are themselves AppImages; hosted
          # runners have no FUSE, so extract-and-run instead of mounting, and put
          # the plugin on PATH where linuxdeploy discovers it by name.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          # so linuxdeploy's ldd resolves the from-source jsoncpp for bundling
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          # appimagetool wants the icon file named after the desktop's Icon= key (openxcom).
          cp res/linux/icons/openxcom_128x128.png openxcom.png
          # OUTPUT keeps the v1.8.4 asset name so existing docs/links still match.
          OUTPUT=OpenXcoop-x86_64.AppImage \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/bin/openxcom \
            --desktop-file res/linux/openxcom.desktop \
            --icon-file openxcom.png \
            --output appimage
          test -f OpenXcoop-x86_64.AppImage

      - name: Package Linux zip
        env:
          RELEASE_RENDEZVOUS_JSON: ${{ secrets.RELEASE_RENDEZVOUS_JSON }}
        run: |
          set -euxo pipefail
          v="${{ needs.meta.outputs.version }}"
          pkg="openxcom-coop-linux-$v-x86_64"
          mkdir -p "$pkg/UFO" "$pkg/TFTD"
          # Self-contained AppImage instead of the bare binary (see the AppImage step).
          cp OpenXcoop-x86_64.AppImage "$pkg/"
          chmod +x "$pkg/OpenXcoop-x86_64.AppImage"
          cp -r bin/common bin/standard "$pkg/"
          # coop art only - never the whole UFO/TFTD dir (licensed retail data).
          # Globe's ctor throws on a missing multiplayer/base.png, killing "new game".
          cp -r bin/UFO/multiplayer  "$pkg/UFO/"
          cp -r bin/TFTD/multiplayer "$pkg/TFTD/"
          cp LICENSE.txt "$pkg/"      # required by assert_package_dir.sh; fail loudly if it moves
          # real rendezvous.json from the secret (same as the x64 release); UFO data is NOT included (licensed)
          if [ -z "$RELEASE_RENDEZVOUS_JSON" ]; then echo "RELEASE_RENDEZVOUS_JSON secret empty"; exit 1; fi
          printf '%s' "$RELEASE_RENDEZVOUS_JSON" > "$pkg/rendezvous.json"
          python3 -c "import json; json.load(open('$pkg/rendezvous.json'))" || { echo "rendezvous.json not valid JSON"; exit 1; }
          # The AppImage finds its data via CWD, so it must be launched from this
          # folder - spell that out to avoid a "no data" launch from elsewhere.
          cat > "$pkg/HOW_TO_RUN.txt" <<'EOF'
          OpenXcom Coop - Linux
          =====================
          Keep OpenXcoop-x86_64.AppImage in THIS folder (next to common/, standard/,
          UFO/, TFTD/, rendezvous.json) and run it from here:

              chmod +x OpenXcoop-x86_64.AppImage
              ./OpenXcoop-x86_64.AppImage

          The game looks for its data in the current folder, so launching the
          AppImage from somewhere else (e.g. double-clicking after moving it out)
          will fail to find the game data.
          EOF
          sh tools/ci/assert_package_dir.sh "$pkg"
          # mod.io only accepts .zip, so ship a zip (not a tar.gz). -r recurses the
          # staged folder; -y stores symlinks as-is rather than following them.
          zip -ry "$pkg.zip" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: openxcom-coop-linux-${{ needs.meta.outputs.version }}-x86_64.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: sym-linux
          path: openxcom-linux-x86_64.debug
          if-no-files-found: error
          retention-days: 7

  # Native Apple Silicon macOS build. Appended after the existing Windows, WinXP,
  # and Linux jobs so their build/test/release flow remains unchanged. The package
  # contains only public coop assets; licensed UFO data is fetched later only by
  # the macOS test jobs and is never uploaded in an artifact or release asset.
  build-macos:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install \
            cmake pkgconf autoconf automake libtool \
            sdl12-compat sdl2-compat sdl3 sdl_gfx \
            jsoncpp libsodium libvorbis flac libmikmod \
            libpng jpeg-turbo libtiff zlib

          local_prefix="$GITHUB_WORKSPACE/.mac-deps"
          mkdir -p "$local_prefix"

          # Homebrew's Apple Silicon prefix is /opt/homebrew, which Clang does not
          # search automatically. SDL_image/mixer/net 1.2 are built below into the
          # local prefix, while the remaining dependencies come from Homebrew.
          pc_paths=("$local_prefix/lib/pkgconfig")
          include_paths=("$local_prefix/include" "$local_prefix/include/SDL")
          lib_paths=("$local_prefix/lib")
          for formula in sdl12-compat sdl_gfx jsoncpp libsodium libvorbis flac libmikmod libpng jpeg-turbo libtiff zlib; do
            prefix="$(brew --prefix "$formula")"
            [[ -d "$prefix/lib/pkgconfig" ]] && pc_paths+=("$prefix/lib/pkgconfig")
            [[ -d "$prefix/share/pkgconfig" ]] && pc_paths+=("$prefix/share/pkgconfig")
            [[ -d "$prefix/include" ]] && include_paths+=("$prefix/include")
            [[ -d "$prefix/lib" ]] && lib_paths+=("$prefix/lib")
          done

          {
            echo "MAC_DEPS_PREFIX=$local_prefix"
            echo "PKG_CONFIG_PATH=$(IFS=:; echo "${pc_paths[*]}")"
            echo "CPPFLAGS=$(printf -- '-I%s ' "${include_paths[@]}")"
            echo "LDFLAGS=$(printf -- '-L%s ' "${lib_paths[@]}")"
            echo "PATH=$local_prefix/bin:$PATH"
          } >> "$GITHUB_ENV"

      - name: Build SDL 1.2 companion libraries
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/sdl12-deps"
          rm -rf "$src"
          mkdir -p "$src"
          cd "$src"

          modern_guess="$(find "$(brew --prefix automake)/share" -name config.guess -type f | head -1)"
          modern_sub="$(find "$(brew --prefix automake)/share" -name config.sub -type f | head -1)"
          [[ -f "$modern_guess" && -f "$modern_sub" ]]

          build_autotools() {
            local name="$1"
            local version="$2"
            local url="$3"
            local archive="${name}-${version}.tar.gz"

            curl --fail --location --retry 5 --retry-all-errors \
              --output "$archive" "$url"
            tar -xzf "$archive"
            cd "${name}-${version}"

            # The original release tarballs predate Apple Silicon. Replace their
            # platform-detection helpers and keep legacy C warnings local to them.
            while IFS= read -r -d '' f; do cp "$modern_guess" "$f"; done < <(find . -name config.guess -print0)
            while IFS= read -r -d '' f; do cp "$modern_sub" "$f"; done < <(find . -name config.sub -print0)

            CFLAGS="${CFLAGS:-} -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration" \
            OBJCFLAGS="${OBJCFLAGS:-} -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration" \
            SDL_CONFIG="$(brew --prefix sdl12-compat)/bin/sdl-config" \
              ./configure --prefix="$MAC_DEPS_PREFIX" --disable-dependency-tracking
            make -j"$(sysctl -n hw.logicalcpu)"
            make install
            cd "$src"
          }

          build_autotools SDL_image 1.2.12 \
            https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          build_autotools SDL_mixer 1.2.12 \
            https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          build_autotools SDL_net 1.2.8 \
            https://www.libsdl.org/projects/SDL_net/release/SDL_net-1.2.8.tar.gz

          pkg-config --modversion sdl SDL_image SDL_gfx SDL_mixer SDL_net libsodium zlib jsoncpp

      - name: Stamp src/version.h
        shell: bash
        run: sh tools/ci/stamp_version.sh "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.gitSuffix }}"

      - name: Configure + build macOS arm64 bundle
        shell: bash
        run: |
          set -euxo pipefail
          jsoncpp_cflags="$(pkg-config --cflags jsoncpp)"
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEV_BUILD=OFF \
            -DBUILD_PACKAGE=OFF \
            -DCREATE_BUNDLE=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$MAC_DEPS_PREFIX;$(brew --prefix)" \
            -DCMAKE_C_FLAGS="$CPPFLAGS" \
            -DCMAKE_CXX_FLAGS="$CPPFLAGS $jsoncpp_cflags" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS"
          cmake --build build-macos --config Release --parallel 3

          exe="build-macos/openxcom.app/Contents/MacOS/openxcom"
          test -x "$exe"
          file "$exe"
          file "$exe" | grep -q 'arm64'

      - name: Prepare + validate macOS package
        shell: bash
        env:
          RELEASE_RENDEZVOUS_JSON: ${{ secrets.RELEASE_RENDEZVOUS_JSON }}
        run: |
          set -euxo pipefail
          app="build-macos/openxcom.app"
          resources="$app/Contents/Resources"

          # sdl12-compat loads SDL2 with dlopen(), so CMake cannot discover it
          # as a normal linked dependency. Bundle Homebrew's SDL2 and SDL3
          # compatibility runtimes explicitly before signing the application.
          bash tools/ci/bundle_macos_sdl_runtime.sh "$app"

          if [[ -z "${RELEASE_RENDEZVOUS_JSON:-}" ]]; then
            echo "::error::RELEASE_RENDEZVOUS_JSON is empty or unset"
            exit 1
          fi
          RENDEZVOUS_PATH="$resources/rendezvous.json" \
          RELEASE_RENDEZVOUS_JSON="$RELEASE_RENDEZVOUS_JSON" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["RELEASE_RENDEZVOUS_JSON"]
          parsed = json.loads(raw)
          servers = parsed.get("servers")
          if not isinstance(servers, list) or not servers:
              raise SystemExit("RELEASE_RENDEZVOUS_JSON must contain a non-empty servers array")
          Path(os.environ["RENDEZVOUS_PATH"]).write_text(raw, encoding="ascii")
          PY

          # Ad-hoc signing is sufficient for CI and local testing on the Mac mini.
          # It is not notarization and does not require an Apple Developer account.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # Load the bundled SDL 1.2 compatibility library directly. Its startup
          # path must now find the bundled SDL2 runtime, which in turn must find
          # the bundled SDL3 runtime. This catches the exact failure seen on the
          # Mac mini before an artifact is uploaded.
          bundled_sdl12="$(find "$app/Contents/Frameworks" -maxdepth 1 -type f -name 'libSDL-1.2*.dylib' | head -1)"
          test -n "$bundled_sdl12"
          BUNDLED_SDL12="$bundled_sdl12" \
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
          python3 - <<'PY'
          import ctypes
          import os

          sdl = ctypes.CDLL(os.environ["BUNDLED_SDL12"])
          sdl.SDL_Init.argtypes = [ctypes.c_uint32]
          sdl.SDL_Init.restype = ctypes.c_int
          sdl.SDL_GetError.restype = ctypes.c_char_p
          if sdl.SDL_Init(0) != 0:
              error = sdl.SDL_GetError()
              raise SystemExit(error.decode("utf-8", errors="replace") if error else "SDL_Init failed")
          sdl.SDL_Quit()
          print("Bundled SDL 1.2 -> SDL2 -> SDL3 runtime chain loaded successfully.")
          PY

          test -d "$resources/common"
          test -d "$resources/standard"
          test -f "$resources/UFO/multiplayer/base.png"
          test ! -e "$resources/UFO/GEODATA"

          # The finished app must not depend on Homebrew or checkout paths that only
          # exist on the GitHub runner. PostprocessBundle.cmake should internalize them.
          bad=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              echo "--- $f"
              dependencies="$(otool -L "$f")"
              rpaths="$(otool -l "$f" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }')"
              printf '%s\n' "$dependencies"
              if [[ -n "$rpaths" ]]; then
                printf 'LC_RPATH: %s\n' "$rpaths"
              fi
              if printf '%s\n%s\n' "$dependencies" "$rpaths" | grep -E '/opt/homebrew|/usr/local|/Users/runner/work'; then
                echo "::error::unbundled dependency or runtime path in $f"
                bad=1
              fi
            fi
          done < <(find "$app" -type f -print0)
          [[ "$bad" -eq 0 ]]

      - name: Package macOS app
        id: mac-package
        shell: bash
        run: |
          set -euxo pipefail
          package="openxcom-coop-macos-${{ needs.meta.outputs.version }}-arm64"
          mkdir -p "$package"
          ditto build-macos/openxcom.app "$package/openxcom.app"
          cp LICENSE.txt "$package/"
          cat > "$package/HOW_TO_RUN.txt" <<'EOF'
          OpenXcom Coop - macOS Apple Silicon
          ===================================

          This build is for Apple Silicon Macs (M1/M2/M3/M4), including an M4 Mac mini.

          1. Extract the zip.
          2. Copy your legally owned UFO: Enemy Unknown data into:
             ~/Library/Application Support/OpenXcom/UFO/
          3. Open openxcom.app. Because this CI build is not Apple-notarized, the first
             launch may require right-clicking the app and choosing Open.

          The zip deliberately contains no licensed UFO game data.
          EOF
          zip="${package}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$package" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: ${{ steps.mac-package.outputs.zip }}
          if-no-files-found: error
          retention-days: 7


  # Keep the original publish job untouched. After it has created the nightly or
  # versioned release, append the successfully built macOS package as one more asset.
  publish-macos:
    needs: [meta, publish, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-macos
          path: .pkg-macos

      - name: Attach macOS package to the existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          package="$(find .pkg-macos -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -n "$package"
          gh release upload "${{ needs.meta.outputs.tag }}" "$package" \
            --repo "$GITHUB_REPOSITORY" --clobber
