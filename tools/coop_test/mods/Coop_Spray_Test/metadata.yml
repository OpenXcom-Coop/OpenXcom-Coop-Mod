name: "Coop spray / unprime / one-click medikit probe"
version: 1.0
description: "Test-only fixture for W2-P4 (client combat intents). Data only. Makes
  three client combat paths reachable that stock xcom1 data never reaches: the OXCE
  spray autoshot (STR_RIFLE sprayWaypoints), the UNPRIME action-menu row
  (STR_GRENADE unprimeActionName) and the one-click medikit (a new, non-recoverable
  STR_MEDI_KIT_ONE_CLICK with medikitType 1), plus a consumable one-charge
  full-screen medikit (STR_MEDI_KIT_ONE_CHARGE, isConsumable, non-recoverable)
  whose removal after its last charge is otherwise unreachable, and three soldier
  skills on STR_SOLDIER (a continue-into-snap skill, a stop skill and an
  instant-grenade skill) whose scripts no stock data has. Both machines in a
  co-op pair must load it."
author: coop harness

master: xcom1
